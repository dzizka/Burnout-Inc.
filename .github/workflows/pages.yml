name: Deploy na GitHub Pages

# Každý push do main nasadí hrateľnú verziu, aby sa dala skúšať na mobile v prehliadači.
# Vyžaduje: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fine-grained token s právom Contents: Read na súkromné repo s platenými assetmi.
      # Bez neho sa hra nasadí s Kenney grafikou (docs/ASSETS.md).
      ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Stiahnuť platené assety (súkromné repo)
        if: env.ASSETS_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: dzizka/burnout-inc-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: private-assets
      - name: Pribaliť platené assety do hry
        if: env.ASSETS_TOKEN != ''
        run: |
          mkdir -p public/assets/limezu
          cp private-assets/limezu/office.png private-assets/limezu/room.png public/assets/limezu/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
