<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16171b" />
    <title>Burnout Inc.</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>

      <div id="ui-layer">
        <header id="status-bar">
          <div class="stat" id="cash-stat" data-i18n-title="hud.cash">
            <span id="cash-display">€ 0</span>
          </div>
          <div class="stat" id="calendar">
            <span id="day-display"></span>
            <span id="clock-display"></span>
          </div>
          <div class="stat meter-stat" data-i18n-title="hud.market">
            <span class="label" data-i18n="hud.market"></span>
            <div class="market-bar">
              <div id="market-player"></div>
              <div id="market-rival"></div>
            </div>
            <span id="market-value"></span>
          </div>
          <div class="stat meter-stat" data-i18n-title="hud.scandal">
            <span class="label" data-i18n="hud.scandal"></span>
            <div class="scandal-bar"><div id="scandal-fill"></div></div>
            <span id="scandal-value"></span>
          </div>
          <div class="stat" id="tickets-stat" data-i18n-title="hud.tickets" hidden>
            <span>☎</span><span id="tickets-value"></span>
          </div>
          <div id="time-controls">
            <button data-speed="0" data-i18n-title="time.pause">❚❚</button>
            <button data-speed="1">▶</button>
            <button data-speed="2">▶▶</button>
            <button data-speed="3">▶▶▶</button>
          </div>
          <button id="btn-lang" data-i18n-title="menu.language">SK</button>
          <button id="btn-menu" data-i18n-title="menu.title">☰</button>
        </header>

        <div id="toast" role="status" aria-live="polite"></div>

        <section id="build-panel" class="dock-panel" hidden>
          <div class="panel-header">
            <span data-i18n="build.title"></span>
            <button id="btn-sell" data-i18n="build.sell"></button>
            <button id="btn-build-close" data-i18n-title="build.close">×</button>
          </div>
          <div id="build-items"></div>
          <p class="hint" data-i18n="build.hint"></p>
        </section>

        <section id="finance-panel" class="dock-panel" hidden>
          <div class="panel-header">
            <span data-i18n="finance.title"></span>
            <button id="btn-finance-close" data-i18n-title="build.close">×</button>
          </div>
          <p id="finance-warning" class="warning" data-i18n="finance.warning" hidden></p>
          <div class="finance-cols">
            <div>
              <h3 data-i18n="finance.thisMonth"></h3>
              <div id="finance-month"></div>
              <h3 data-i18n="finance.upcoming"></h3>
              <div id="finance-upcoming"></div>
              <h3 data-i18n="finance.history"></h3>
              <div id="finance-history"></div>
            </div>
            <div>
              <h3 data-i18n="finance.loans"></h3>
              <div id="finance-loans"></div>
              <button id="btn-loan" class="wide"></button>
              <h3 data-i18n="finance.scandal"></h3>
              <p id="finance-scandal" class="note"></p>
              <button id="btn-pr" class="wide"></button>
            </div>
          </div>
        </section>

        <section id="menu-panel" class="dock-panel" hidden>
          <div class="panel-header">
            <span data-i18n="menu.title"></span>
            <button id="btn-menu-close" data-i18n-title="build.close">×</button>
          </div>
          <div class="menu-actions">
            <button id="btn-save" data-i18n="menu.save"></button>
            <button id="btn-new-game" data-i18n="menu.newGame"></button>
          </div>
          <p class="note" data-i18n="menu.autosave"></p>
        </section>

        <section id="projects-panel" class="dock-panel" hidden>
          <div class="panel-header">
            <span data-i18n="projects.title"></span>
            <button id="btn-projects-close" data-i18n-title="build.close">×</button>
          </div>
          <div class="projects-cols">
            <div id="project-area"></div>
            <div>
              <h3 data-i18n="projects.live"></h3>
              <div id="product-list"></div>
              <p id="tickets-line" class="note"></p>
            </div>
          </div>
        </section>

        <section id="staff-panel" class="dock-panel" hidden>
          <div class="panel-header">
            <span class="title"></span>
            <button id="btn-staff-close" data-i18n-title="build.close">×</button>
          </div>
          <div class="staff-cols">
            <div>
              <h3 data-i18n="staff.employees"></h3>
              <div id="staff-list"></div>
            </div>
            <div>
              <h3 data-i18n="staff.candidates"></h3>
              <div id="candidate-list"></div>
            </div>
          </div>
        </section>

        <aside id="inspector" hidden>
          <div class="panel-header">
            <span class="name"></span>
            <button id="btn-inspect-close" data-i18n-title="inspect.close">×</button>
          </div>
          <p class="activity"></p>
          <p class="wage"></p>
          <div class="needs"></div>
          <div class="actions">
            <button id="btn-bonus"></button>
            <button id="btn-break" data-i18n="inspect.break"></button>
            <button id="btn-fire" data-i18n="inspect.fire"></button>
            <button id="btn-scapegoat"></button>
          </div>
        </aside>

        <footer id="bottom-dock">
          <button id="tab-build" data-i18n="dock.build"></button>
          <button id="tab-staff" data-i18n="dock.staff"></button>
          <button id="tab-rd" data-i18n="dock.projects"></button>
          <button id="tab-sabotage" data-i18n="dock.blackops"></button>
        </footer>
      </div>
    </div>
    <div id="game-over" hidden>
      <div class="game-over-box">
        <h1 id="game-over-title"></h1>
        <p id="game-over-text"></p>
        <p id="game-over-stats" class="note"></p>
        <button id="btn-game-over-new" data-i18n="menu.newGame"></button>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
